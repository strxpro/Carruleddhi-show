<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Never indexed. It is a back office, and a search result for it is only ever an
       invitation to try the door. The password is checked on the server regardless. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071a3d">
  <title>Panel — Carruleddhi Show 2026</title>

  <!-- Set before React mounts, so there is no white flash on a dark panel opened at
       night. Cheaper than a loading screen and it cannot get out of step with the CSS. -->
  <style>
    html, body { margin: 0; background: #071a3d; }
    #admin-root:empty::after {
      content: "";
      position: fixed;
      inset: 0;
      background: #071a3d;
    }
  </style>
</head>
<body>
  <div id="admin-root"></div>
  <script type="module" src="/src/admin/main.tsx"></script>
</body>
</html>
