name = "carruleddhi-intake"
main = "index.js"
compatibility_date = "2026-08-01"

# BEZ PUBLICZNEGO ADRESU. To nie jest ozdoba, to zabezpieczenie.
# ---------------------------------------------------------------------------
# Ten Worker robi dzis jedna rzecz: zegar przypomnien (patrz [triggers] nizej). Strona i API
# stoja na Vercelu — api/intake.js uruchamia ten sam plik, a vercel.json przekierowuje tam
# /api/carruleddhi/*.
#
# Bez tej linii `wrangler deploy` proponuje rejestracje subdomeny workers.dev i konczy sie
# bledem, gdy odmowisz. A zgoda bylaby GORSZA niz blad: ponizej stoi [assets] z katalogiem
# ../dist, wiec pod adresem carruleddhi-intake.<cos>.workers.dev opublikowalaby sie DRUGA,
# publiczna kopia calej strony — razem z admin.html i czternastoma PDF-ami. Druga wersja w
# wyszukiwarce, druga furtka do panelu i formularze odpowiadajace bledem, bo ten Worker nie
# ma sekretow aplikacji.
#
# `false` znaczy: wdroz kod i zegar, nie wystawiaj niczego na swiat.
workers_dev = false

# Serve the built site and let the Worker answer only /api/carruleddhi/*.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/carruleddhi/*"]

# Zegar przypomnien. Co godzine, rowno o pelnej — ta sama kadencja, ktora wczesniej
# odmierzal GitHub Actions (.github/workflows/reminders.yml), przeniesiona tutaj po tym,
# jak Actions stanelo na zablokowanych rozliczeniach konta.
#
# Cron Triggers sa w darmowym planie Workers. Godzina wystarcza, bo `remindersDue()` sam
# liczy, ktore przypomnienie jest nalezne z OKIEN czasowych, a nie z dokladnej godziny —
# spozniony przebieg nadrabia, pominiety nic nie kosztuje.
#
# UWAGA: sam wpis w tym pliku niczego nie uruchamia. Wchodzi w zycie dopiero po
#   npx wrangler deploy
[triggers]
crons = ["0 * * * *"]

# Logi wlaczone na stale.
# ---------------------------------------------------------------------------
# Wlaczone klikiem w panelu, ale panel sam ostrzega: ustawienie zrobione recznie moze zostac
# nadpisane przy nastepnym `wrangler deploy`. Zapisane tutaj przezywa kazde wdrozenie.
#
# Bez logow widac tylko, ze budzik zadzwonil — nie widac, czy wysylka sie udala. Gdyby
# ROSTER_KEY rozjechal sie z Vercelem choc o litere, cron chodzilby co godzine, licznik by
# rosl, a maile nie wychodzilyby wcale. Dokladnie ta cicha awaria kosztowala juz tydzien
# przypomnien; console.log w scheduled() wypisuje status odpowiedzi wlasnie po to.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Comma separated. Leave empty during local development.
ALLOWED_ORIGINS = ""

# Dokad zegar puka. Zwykla zmienna, nie sekret — to publiczny adres strony.
SITE_URL = "https://www.carruleddhishow.com"

# Optional throttling store. Create it once, then paste the id here:
#   npx wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<kv-namespace-id>"

# JEDYNY SEKRET POTRZEBNY DO ZEGARA PRZYPOMNIEN:
#   npx wrangler secret put ROSTER_KEY
# Ta sama wartosc co w Vercelu. Zegar nie czyta bazy sam — puka do zywego endpointu na
# Vercelu, gdzie sa dane i reszta sekretow. Dlatego NIE trzeba tu wpisywac
# SUPABASE_SERVICE_KEY ani WALL_SALT; zwlaszcza tej drugiej, bo dwie rozne sole znacza
# odsylacze z maili, ktore przestaja przechodzic walidacje bez zadnego bledu w logach.
#
# Pozostale sekrety nizej sa potrzebne TYLKO wtedy, gdy kiedys przeniesiesz tu cala strone.
#
# Secrets are never written here. Set them with:
#   npx wrangler secret put MAKE_WEBHOOK_URL       # required for the forms
#   npx wrangler secret put ROSTER_KEY             # admin participant list
#   npx wrangler secret put SUPABASE_URL           # public wall
#   npx wrangler secret put SUPABASE_SERVICE_KEY   # public wall
#   npx wrangler secret put WALL_SALT              # public wall, any long random string
#   npx wrangler secret put INTAKE_SHARED_KEY      # optional
#   npx wrangler secret put TURNSTILE_SECRET       # optional
