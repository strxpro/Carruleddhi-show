  <!-- "SANTA TERESA GALLURA · ROUTE STUDY" was burnt into the artwork here. It read
       like a watermark on a draft, it could not be translated, and the caption under
       the figure already says where this is. Removed. "MARE" stays: it is one word,
       it is the same word in the language of the place, and it orients the picture. -->
  <g fill="#071a3d" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3">
    <text x="964" y="840" font-size="17" fill="#fff">MARE</text>
